document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{to{transform:rotate(360deg)}}\n@keyframes belt{to{background-position:-28px 0}}\n@keyframes ride{from{transform:translateX(-60px)}to{transform:translateX(340px)}}\n@keyframes dash{to{stroke-dashoffset:-30}}\n@keyframes sway{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}\n@keyframes sound{0%{opacity:0;transform:scale(.7)}40%{opacity:1}100%{opacity:0;transform:scale(1.15)}}\n@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}\n@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}\n@keyframes drip{from{background-position:0 0}to{background-position:0 24px}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;flex-direction:column;background:#EEF1F5;\" sc-camel-on-click=\"{{ deselect }}\">\n  <div style=\"display:flex;align-items:center;gap:20px;padding:0 20px;height:60px;background:#13477B;color:#fff;flex-shrink:0;\">\n    <div style=\"display:flex;align-items:center;gap:12px;\">\n      <div style=\"width:36px;height:36px;background:#F27423;display:grid;place-items:center;font-weight:800;font-size:13px;color:#13477B;letter-spacing:.5px;border-radius:3px;\">COS<\u002Fdiv>\n      <div style=\"line-height:1.15;\"><div style=\"font-size:10px;letter-spacing:2.2px;opacity:.75;font-weight:600;\">COLLEGE OF THE SEQUOIAS<\u002Fdiv><div style=\"font-size:19px;font-weight:700;\">PLC Ladder Logic Lab<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;\"><\u002Fdiv>\n    <sc-if value=\"{{ inLevel }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;gap:14px;\">\n        <div style=\"font-size:13px;opacity:.85;white-space:nowrap;\">Level <b style=\"font-size:15px;\">{{ levelNum }}<\u002Fb> / {{ levelCount }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;background:rgba(0,0,0,.25);padding:4px 12px;border-radius:4px;letter-spacing:1px;color:{{ clockColor }};\">{{ clock }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ hasName }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;gap:8px;\">\n        <div style=\"font-size:13px;opacity:.85;margin-right:6px;\">{{ name }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goSelect }}\" style=\"background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);padding:7px 12px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;\" style-hover=\"background:rgba(255,255,255,.22)\">Levels<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ toggleBoard }}\" style=\"background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);padding:7px 12px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;\" style-hover=\"background:rgba(255,255,255,.22)\">Leaderboard<\u002Fbutton>\n        <sc-if value=\"{{ inLevel }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ toggleRef }}\" style=\"background:#F27423;color:#fff;border:none;padding:8px 12px;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;\" style-hover=\"background:#FF8A3D\">Reference<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isStart }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex:1;display:grid;place-items:center;padding:40px 20px;\">\n      <div style=\"width:100%;max-width:520px;background:#fff;border-radius:8px;padding:36px 40px;box-shadow:0 10px 30px rgba(19,71,123,.12);border-top:6px solid #F27423;\">\n        <div style=\"font-size:12px;letter-spacing:2px;font-weight:700;color:#F27423;\">GIANTS INDUSTRIAL TECH<\u002Fdiv>\n        <h1 style=\"margin:8px 0 12px;font-size:36px;font-weight:800;line-height:1.05;color:#13477B;\">Ladder Logic Challenge<\u002Fh1>\n        <p style=\"margin:0 0 22px;font-size:16px;line-height:1.5;color:#3B4A63;text-wrap:pretty;\">Each run draws 15 real-world control problems from a bank of 40 — contacts, logic, latching, timers, counters and sequencing. Drag Allen-Bradley style instructions onto the rungs, watch power flow, then run the tests. Fastest total time for a full set tops the leaderboard.<\u002Fp>\n        <label style=\"display:block;font-size:12px;font-weight:700;letter-spacing:1px;color:#64748B;margin-bottom:6px;\">YOUR NAME<\u002Flabel>\n        <div style=\"display:flex;gap:10px;\">\n          <input value=\"{{ nameInput }}\" sc-camel-on-change=\"{{ onNameInput }}\" sc-camel-on-key-down=\"{{ onNameKey }}\" placeholder=\"e.g. Maria G.\" style=\"flex:1;font-size:18px;padding:12px 14px;border:2px solid #CBD5E1;border-radius:6px;outline:none;color:#14213D;\" style-focus=\"border-color:#13477B\">\n          <button sc-camel-on-click=\"{{ startGame }}\" style=\"background:#F27423;color:#fff;border:none;padding:0 22px;border-radius:6px;font-size:16px;font-weight:700;cursor:pointer;\" style-hover=\"background:#FF8A3D\">Start<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasReturning }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:14px;font-size:13px;color:#64748B;\">Returning? Type the same name to pick up where you left off.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSelect }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;padding:28px 24px;max-width:1180px;width:100%;margin:0 auto;box-sizing:border-box;\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;\">\n        <div><h2 style=\"margin:0;font-size:28px;font-weight:800;color:#13477B;\">Your set<\u002Fh2><div style=\"color:#64748B;font-size:14px;margin-top:4px;\">{{ drawCount }} problems drawn from a bank of {{ bankCount }} · {{ doneCount }} of {{ levelCount }} complete · Total time {{ totalClock }}<\u002Fdiv><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ newRun }}\" style=\"background:#fff;color:#13477B;border:2px solid #13477B;padding:9px 16px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;\" style-hover=\"background:#13477B;color:#fff\">⟳ Draw a new set<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;\">\n        <sc-for list=\"{{ levelCards }}\" as=\"lv\" hint-placeholder-count=\"15\">\n          <div sc-camel-on-click=\"{{ lv.onOpen }}\" style=\"background:#fff;border-radius:8px;padding:16px 18px;cursor:pointer;border:2px solid {{ lv.border }};box-shadow:0 2px 8px rgba(19,71,123,.06);display:flex;flex-direction:column;gap:8px;min-height:120px;\" style-hover=\"border-color:#F27423;transform:translateY(-2px)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#64748B;\">LEVEL {{ lv.n }}<\u002Fdiv>\n              <sc-if value=\"{{ lv.done }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width:22px;height:22px;border-radius:50%;background:#F27423;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;\">✓<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"font-size:19px;font-weight:700;color:#13477B;line-height:1.1;\">{{ lv.title }}<\u002Fdiv>\n            <div style=\"font-size:12px;font-weight:600;color:#F27423;letter-spacing:.5px;\">{{ lv.topic }}<\u002Fdiv>\n            <div style=\"flex:1;\"><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#64748B;\">{{ lv.best }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isFinish }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:grid;place-items:center;padding:40px 20px;\">\n      <div style=\"width:100%;max-width:560px;background:#fff;border-radius:8px;padding:36px 40px;box-shadow:0 10px 30px rgba(19,71,123,.12);border-top:6px solid #F27423;text-align:center;\">\n        <div style=\"font-size:12px;letter-spacing:2px;font-weight:700;color:#F27423;\">SET COMPLETE · {{ levelCount }} PROBLEMS<\u002Fdiv>\n        <h1 style=\"margin:8px 0 6px;font-size:36px;font-weight:800;color:#13477B;\">Nice work, {{ name }}.<\u002Fh1>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:40px;font-weight:600;color:#14213D;margin:10px 0 4px;\">{{ totalClock }}<\u002Fdiv>\n        <div style=\"color:#64748B;font-size:14px;margin-bottom:22px;\">total time · rank #{{ rank }} on this machine<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;justify-content:center;\">\n          <button sc-camel-on-click=\"{{ toggleBoard }}\" style=\"background:#13477B;color:#fff;border:none;padding:12px 20px;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;\">View leaderboard<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ newRun }}\" style=\"background:#fff;color:#13477B;border:2px solid #13477B;padding:10px 20px;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;\">Draw a new set<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ inLevel }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;align-items:stretch;min-height:0;\">\n      <div style=\"width:296px;flex-shrink:0;background:#fff;border-right:1px solid #DCE2EA;padding:18px 18px 28px;overflow-y:auto;box-sizing:border-box;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#64748B;letter-spacing:1px;\">LEVEL {{ levelNum }} · {{ level.topic }}<\u002Fdiv>\n        <h2 style=\"margin:4px 0 10px;font-size:24px;font-weight:800;color:#13477B;line-height:1.1;\">{{ level.title }}<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:14px;line-height:1.5;color:#3B4A63;text-wrap:pretty;\">{{ level.brief }}<\u002Fp>\n\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:1.5px;color:#64748B;margin:18px 0 8px;\">INPUTS<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;\">\n          <sc-for list=\"{{ inputs }}\" as=\"io\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;background:#F6F8FA;border-radius:6px;\">\n              <sc-if value=\"{{ io.isToggle }}\" hint-placeholder-val=\"{{ true }}\">\n                <div sc-camel-on-click=\"{{ io.onToggle }}\" style=\"width:44px;height:24px;border-radius:12px;background:{{ io.trackColor }};position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;\">\n                  <div style=\"position:absolute;top:3px;left:{{ io.knobLeft }};width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s;\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ io.isPB }}\" hint-placeholder-val=\"{{ false }}\">\n                <div sc-camel-on-mouse-down=\"{{ io.onDown }}\" sc-camel-on-mouse-up=\"{{ io.onUp }}\" sc-camel-on-mouse-leave=\"{{ io.onUp }}\" sc-camel-on-touch-start=\"{{ io.onDown }}\" sc-camel-on-touch-end=\"{{ io.onUp }}\" style=\"width:44px;height:44px;border-radius:50%;background:{{ io.pbColor }};border:4px solid #D6DCE5;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);cursor:pointer;flex-shrink:0;user-select:none;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;font-family:'IBM Plex Mono',monospace;\">{{ io.pbLabel }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"min-width:0;flex:1;\">\n                <div style=\"display:flex;align-items:center;gap:6px;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:#14213D;\">{{ io.name }}<\u002Fspan><span style=\"width:8px;height:8px;border-radius:50%;background:{{ io.dot }};\"><\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:12px;color:#64748B;line-height:1.3;\">{{ io.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:1.5px;color:#64748B;margin:18px 0 8px;\">OUTPUTS<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;\">\n          <sc-for list=\"{{ outputs }}\" as=\"io\" hint-placeholder-count=\"1\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;background:#F6F8FA;border-radius:6px;\">\n              <div style=\"width:28px;height:28px;border-radius:50%;background:{{ io.lamp }};border:3px solid #D6DCE5;flex-shrink:0;box-shadow:{{ io.glow }};\"><\u002Fdiv>\n              <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;\">{{ io.name }}<\u002Fdiv><div style=\"font-size:12px;color:#64748B;\">{{ io.desc }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasTimers }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:1.5px;color:#64748B;margin:18px 0 8px;\">TIMERS &amp; COUNTERS<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <sc-for list=\"{{ timerVMs }}\" as=\"tm\" hint-placeholder-count=\"1\">\n              <div style=\"padding:8px 10px;background:#F6F8FA;border-radius:6px;font-family:'IBM Plex Mono',monospace;\">\n                <div style=\"display:flex;justify-content:space-between;font-size:13px;font-weight:600;\"><span>{{ tm.name }}<\u002Fspan><span style=\"color:#64748B;font-weight:400;\">{{ tm.kind }}<\u002Fspan><\u002Fdiv>\n                <div style=\"height:6px;background:#DCE2EA;border-radius:3px;margin:6px 0;overflow:hidden;\"><div style=\"height:100%;width:{{ tm.pct }};background:#F27423;\"><\u002Fdiv><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#3B4A63;\"><span>ACC {{ tm.acc }}<\u002Fspan><span>PRE {{ tm.pre }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:6px;margin-top:6px;\">\n                  <sc-for list=\"{{ tm.bits }}\" as=\"b\" hint-placeholder-count=\"3\">\n                    <span style=\"font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;background:{{ b.bg }};color:{{ b.fg }};\">.{{ b.name }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ resetIO }}\" style=\"margin-top:14px;width:100%;background:#fff;color:#13477B;border:1px solid #CBD5E1;padding:8px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;\" style-hover=\"border-color:#13477B\">Reset I/O state<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:12px 18px;background:#fff;border-bottom:1px solid #DCE2EA;flex-wrap:wrap;\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:1.5px;color:#64748B;margin-right:6px;\">DRAG TO RUNG<\u002Fdiv>\n          <sc-for list=\"{{ parts }}\" as=\"part\" hint-placeholder-count=\"7\">\n            <div draggable=\"true\" sc-camel-on-drag-start=\"{{ part.onDragStart }}\" title=\"{{ part.name }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border:1.5px solid #CBD5E1;border-radius:6px;background:#F6F8FA;cursor:grab;min-width:64px;user-select:none;\" style-hover=\"border-color:#F27423;background:#FFF4EC\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:#13477B;white-space:pre;\">{{ part.glyph }}<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:700;color:#3B4A63;\">{{ part.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"flex:1;\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ clearProgram }}\" style=\"background:none;color:#64748B;border:1px solid #CBD5E1;padding:7px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;\" style-hover=\"color:#B91C1C;border-color:#B91C1C\">Clear program<\u002Fbutton>\n        <\u002Fdiv>\n\n\n        <div style=\"background:radial-gradient(ellipse at 50% 20%,#25385A 0%,#131F33 55%,#0C1729 100%);border-bottom:1px solid #DCE2EA;height:240px;flex-shrink:0;box-sizing:border-box;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:18px 18px 0;\">\n          <div style=\"position:absolute;left:14px;top:10px;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.5);font-weight:700;\">MACHINE · {{ level.title }}<\u002Fdiv>\n          <div style=\"position:absolute;left:0;right:0;bottom:8px;z-index:2;display:flex;justify-content:center;gap:40px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;pointer-events:none;\"><span>{{ sc.cap1 }}<\u002Fspan><span>{{ sc.cap2 }}<\u002Fspan><\u002Fdiv>\n\n          <sc-if value=\"{{ sc.lamp }}\" hint-placeholder-val=\"{{ true }}\"><svg sc-camel-view-box=\"0 0 520 200\" style=\"height:100%;width:auto;max-width:100%;overflow:visible;\"><defs>\n<linearGradient id=\"mt\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#DDE3EB\"><\u002Fstop><stop offset=\".5\" stop-color=\"#9AA5B5\"><\u002Fstop><stop offset=\"1\" stop-color=\"#55627A\"><\u002Fstop><\u002FlinearGradient>\n<linearGradient id=\"mtH\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#55627A\"><\u002Fstop><stop offset=\".5\" stop-color=\"#C9D1DC\"><\u002Fstop><stop offset=\"1\" stop-color=\"#55627A\"><\u002Fstop><\u002FlinearGradient>\n<linearGradient id=\"dk\" x1=\"0\ font-family:'IBM Plex Mono',monospace;\">{{ clock }}<\u002Fb><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ nextLevel }}\" style=\"background:#13477B;color:#fff;border:none;padding:12px 22px;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;\" style-hover=\"background:#1B5A99\">{{ nextLabel }} →<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ refOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"width:270px;flex-shrink:0;background:#fff;border-left:1px solid #DCE2EA;padding:18px;overflow-y:auto;box-sizing:border-box;font-size:13px;line-height:1.45;color:#3B4A63;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;\"><div style=\"font-size:16px;font-weight:800;color:#13477B;\">Instruction reference<\u002Fdiv><button sc-camel-on-click=\"{{ toggleRef }}\" style=\"background:none;border:none;font-size:18px;cursor:pointer;color:#64748B;\">✕<\u002Fbutton><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;\">\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;color:#13477B;\">XIC  ─┤ ├─<\u002Fdiv><b>Examine If Closed.<\u002Fb> Passes power when the tag is ON (1). Normally-open contact.<\u002Fdiv>\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;color:#13477B;\">XIO  ─┤/├─<\u002Fdiv><b>Examine If Open.<\u002Fb> Passes power when the tag is OFF (0). Normally-closed contact.<\u002Fdiv>\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;color:#13477B;\">OTE  ─( )─<\u002Fdiv><b>Output Energize.<\u002Fb> Sets the tag ON while the rung is true, OFF when false. Place in the last column.<\u002Fdiv>\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;color:#13477B;\">TON  [TON]<\u002Fdiv><b>Timer On-Delay.<\u002Fb> While the rung is true, ACC counts up in ms toward PRE. <b>.EN<\u002Fb> rung true · <b>.TT<\u002Fb> timing · <b>.DN<\u002Fb> done (ACC ≥ PRE). Rung false resets it.<\u002Fdiv>\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;color:#13477B;\">CTU  [CTU]<\u002Fdiv><b>Count Up.<\u002Fb> ACC increments once each time the rung goes false → true. <b>.DN<\u002Fb> is ON when ACC ≥ PRE. Needs a RES to clear.<\u002Fdiv>\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;color:#13477B;\">RES  ─(RES)─<\u002Fdiv><b>Reset.<\u002Fb> Clears ACC and .DN of the named timer or counter while the rung is true.<\u002Fdiv>\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;color:#13477B;\">Wire ────<\u002Fdiv>Shorts a cell. Use it in a branch row to make a branch span more than one column.<\u002Fdiv>\n            <div style=\"padding:10px;background:#F6F8FA;border-radius:6px;\"><b>Series = AND.<\u002Fb> Contacts side by side on one line must all pass.<br><b>Parallel = OR.<\u002Fb> A contact on a branch row below offers a second path around the cells above it.<\u002Fdiv>\n            <div style=\"padding:10px;background:#FFF4EC;border-radius:6px;\"><b>Seal-in:<\u002Fb> examine the output's own tag (XIC Motor) on a branch around the Start button so a momentary press stays latched.<\u002Fdiv>\n            <div style=\"padding:10px;background:#F6F8FA;border-radius:6px;\"><b>Tag dot-bits:<\u002Fb> Fan_TMR.DN, Start_TMR.TT, Box_CTR.DN — examine them with XIC / XIO in another rung.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ boardOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ toggleBoard }}\" style=\"position:fixed;inset:0;background:rgba(11,46,82,.55);display:grid;place-items:center;z-index:100;padding:20px;\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:520px;background:#fff;border-radius:8px;padding:26px 30px;border-top:6px solid #F27423;box-shadow:0 20px 50px rgba(0,0,0,.3);\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;\"><h2 style=\"margin:0;font-size:24px;font-weight:800;color:#13477B;\">Leaderboard<\u002Fh2><div style=\"font-size:12px;color:#64748B;\">Fastest total time · full set of {{ drawCount }}<\u002Fdiv><\u002Fdiv>\n        <sc-if value=\"{{ boardEmpty }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding:24px;text-align:center;color:#64748B;\">No finishers yet. Be the first Giant on the board.<\u002Fdiv><\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <sc-for list=\"{{ board }}\" as=\"e\" hint-placeholder-count=\"0\">\n            <div style=\"display:grid;grid-template-columns:36px 1fr auto auto;gap:12px;align-items:center;padding:9px 12px;border-radius:6px;background:{{ e.bg }};\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;color:#F27423;\">{{ e.rank }}<\u002Fdiv>\n              <div style=\"font-weight:700;color:#14213D;\">{{ e.name }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#64748B;\">{{ e.date }}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;\">{{ e.time }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleBoard }}\" style=\"margin-top:18px;width:100%;background:#13477B;color:#fff;border:none;padding:11px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;\">Close<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasMsg }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#14213D;color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;\">{{ msg }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;columns&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:5,&quot;max&quot;:9,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ladder&quot;},&quot;strictOutputs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Ladder&quot;},&quot;scanMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:50,&quot;min&quot;:20,&quot;max&quot;:200,&quot;step&quot;:10,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Simulation&quot;}}\">\nclass Component extends DCLogic {\n  static ON = '#F27423'; static OFF = '#A6B0BE'; static KEY = 'cos_plc_lab_v2'; static DRAW = 15;\n  static GROUPS = ['Contacts', 'Logic', 'Interlocks', 'Latching', 'Timers', 'Counters', 'Sequencing'];\n  static QUOTA = { Contacts: 2, Logic: 3, Interlocks: 2, Latching: 2, Timers: 3, Counters: 2, Sequencing: 1 };\n  static get BANK() {\n    if (this._B) return this._B;\n    const I = (name, ui, def, desc) => ({ name, kind: 'input', ui, def: !!def, desc });\n    const O = (name, desc) => ({ name, kind: 'output', desc });\n    const T = (name, pre, desc) => ({ name, kind: 'timer', pre, desc });\n    const C = (name, pre, desc) => ({ name, kind: 'counter', pre, desc });\n    const X = e => ({ expect: e }), S = (s, w) => ({ set: s, wait: w }), W = w => ({ wait: w });\n    const P = t => [S({ [t]: true }, 80), S({ [t]: false }, 80)];\n    const NC = t => [S({ [t]: false }, 80), S({ [t]: true }, 80)];\n    const B = (id, group, tier, title, topic, rungs, brief, scene, io, test) => ({ id, group, tier, title, topic, rungs, brief, scene, io, tests: [test] });\n    this._B = [\n      B('light', 'Contacts', 1, 'Light Switch', 'XIC · OTE', 1, 'A wall switch controls the shop light. When Switch is ON, Light turns ON.', { kind: 'lamp', lamp: 'Light', switches: ['Switch'] },\n        [I('Switch', 'toggle', false, 'Wall switch'), O('Light', 'Shop light')],\n        [X({ Light: false }), S({ Switch: true }), X({ Light: true }), S({ Switch: false }), X({ Light: false })]),\n      B('dooralarm', 'Contacts', 1, 'Door Alarm', 'XIO', 1, 'Sound the Alarm whenever the door is NOT closed. The sensor is ON while the door is shut, so examine it with an XIO.', { kind: 'door', closed: 'Door_Closed', alarm: 'Alarm' },\n        [I('Door_Closed', 'toggle', true, 'Door sensor — ON when shut'), O('Alarm', 'Buzzer')],\n        [X({ Alarm: false }), S({ Door_Closed: false }), X({ Alarm: true }), S({ Door_Closed: true }), X({ Alarm: false })]),\n      B('dusk', 'Contacts', 1, 'Dusk Light', 'XIO', 1, 'The yard light should come on when it gets dark. The photo sensor is ON in daylight.', { kind: 'lamp', lamp: 'Light', switches: ['Daylight'] },\n        [I('Daylight', 'toggle', true, 'Photo sensor — ON in daylight'), O('Light', 'Yard light')],\n        [X({ Light: false }), S({ Daylight: false }), X({ Light: true }), S({ Daylight: true }), X({ Light: false })]),\n      B('guardlamp', 'Contacts', 1, 'Guard Indicator', 'XIC', 1, 'Turn on the green Safe_Light while the machine guard is closed.', { kind: 'lamp', lamp: 'Safe_Light', switches: ['Guard_Closed'] },\n        [I('Guard_Closed', 'toggle', false, 'Guard door sensor — ON when closed'), O('Safe_Light', 'Green indicator')],\n        [X({ Safe_Light: false }), S({ Guard_Closed: true }), X({ Safe_Light: true }), S({ Guard_Closed: false }), X({ Safe_Light: false })]),\n      B('lowlevel', 'Contacts', 1, 'Low Level Alarm', 'XIO', 1, 'Sound the Alarm when the water drops below the float. The float is ON while the water is above minimum.', { kind: 'lamp', lamp: 'Alarm', switches: ['Low_Level'] },\n        [I('Low_Level', 'toggle', true, 'Float — ON while water is above minimum'), O('Alarm', 'Low water alarm')],\n        [X({ Alarm: false }), S({ Low_Level: false }), X({ Alarm: true }), S({ Low_Level: true }), X({ Alarm: false })]),\n      B('runstop', 'Contacts', 1, 'Run / Stopped Lights', 'XIC + XIO', 2, 'Two indicator lamps: Run_Light while Motor_Sw is ON, Stopped_Light while it is OFF. One rung each.', { kind: 'lamp', lamp: 'Run_Light', lamp2: 'Stopped_Light', switches: ['Motor_Sw'] },\n        [I('Motor_Sw', 'toggle', false, 'Motor selector switch'), O('Run_Light', 'Green run lamp'), O('Stopped_Light', 'Red stopped lamp')],\n        [X({ Run_Light: false, Stopped_Light: true }), S({ Motor_Sw: true }), X({ Run_Light: true, Stopped_Light: false }), S({ Motor_Sw: false }), X({ Run_Light: false, Stopped_Light: true })]),\n      B('twohand', 'Logic', 2, 'Two-Hand Press', 'Series (AND)', 1, 'For safety, the punch Press only runs while BOTH pushbuttons are held at the same time. Hold keyboard keys 1 and 2 together to test it.', { kind: 'press', left: 'Left_PB', right: 'Right_PB', press: 'Press' },\n        [I('Left_PB', 'pb', false, 'Left palm button'), I('Right_PB', 'pb', false, 'Right palm button'), O('Press', 'Press solenoid')],\n        [X({ Press: false }), S({ Left_PB: true }), X({ Press: false }), S({ Right_PB: true }), X({ Press: true }), S({ Left_PB: false }), X({ Press: false }), S({ Right_PB: false, Left_PB: true }), X({ Press: false })]),\n      B('hallway', 'Logic', 2, 'Hallway Light', 'Parallel (OR)', 1, 'A switch at each end of the hallway. Either one turns the Light on. Put the second contact on a parallel branch.', { kind: 'lamp', lamp: 'Light', switches: ['Switch_A', 'Switch_B'] },\n        [I('Switch_A', 'toggle', false, 'Switch at the north end'), I('Switch_B', 'toggle', false, 'Switch at the south end'), O('Light', 'Hallway light')],\n        [X({ Light: false }), S({ Switch_A: true }), X({ Light: true }), S({ Switch_A: false, Switch_B: true }), X({ Light: true }), S({ Switch_A: true }), X({ Light: true }), S({ Switch_A: false, Switch_B: false }), X({ Light: false })]),\n      B('tankfill', 'Logic', 2, 'Tank Fill', 'AND + XIO', 1, 'Run the Pump while Fill_Sw is on — but never when the High_Level float is on, so the tank cannot overflow.', { kind: 'tank', pump: 'Pump', high: 'High_Level' },\n        [I('Fill_Sw', 'toggle', false, 'Fill selector switch'), I('High_Level', 'toggle', false, 'Float switch — ON when tank is full'), O('Pump', 'Fill pump')],\n        [X({ Pump: false }), S({ Fill_Sw: true }), X({ Pump: true }), S({ High_Level: true }), X({ Pump: false }), S({ Fill_Sw: false }), X({ Pump: false }), S({ High_Level: false }), X({ Pump: false }), S({ Fill_Sw: true }), X({ Pump: true })]),\n      B('garage', 'Logic', 2, 'Garage Light', '(OR) AND XIO', 1, 'The garage Light comes on when a car is sensed OR the manual switch is on — but never in daylight.', { kind: 'lamp', lamp: 'Light', switches: ['Car_Sensor', 'Manual_Sw', 'Daylight'] },\n        [I('Car_Sensor', 'toggle', false, 'Driveway sensor'), I('Manual_Sw', 'toggle', false, 'Wall switch'), I('Daylight', 'toggle', false, 'Photo sensor — ON in daylight'), O('Light', 'Garage light')],\n        [X({ Light: false }), S({ Car_Sensor: true }), X({ Light: true }), S({ Daylight: true }), X({ Light: false }), S({ Daylight: false, Car_Sensor: false, Manual_Sw: true }), X({ Light: true }), S({ Manual_Sw: false }), X({ Light: false })]),\n      B('exhaust', 'Logic', 2, 'Exhaust Fan', 'OR with AND branch', 1, 'The exhaust Fan runs when gas is detected, OR when the manual switch is on while the shop door is closed.', { kind: 'fan', fan: 'Fan' },\n        [I('Gas_Detected', 'toggle', false, 'Gas sensor'), I('Manual_Sw', 'toggle', false, 'Manual fan switch'), I('Door_Closed', 'toggle', true, 'Shop door — ON when closed'), O('Fan', 'Exhaust fan')],\n        [X({ Fan: false }), S({ Manual_Sw: true }), X({ Fan: true }), S({ Door_Closed: false }), X({ Fan: false }), S({ Gas_Detected: true }), X({ Fan: true }), S({ Manual_Sw: false }), X({ Fan: true }), S({ Gas_Detected: false }), X({ Fan: false })]),\n      B('handauto',
